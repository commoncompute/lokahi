[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "miki-engine"
version = "0.5.0"
description = "Miki Engine: evidence-gated Apple-Silicon LLM inference and native runtime research"
authors = [
  { name="Anuar Sharafudinov", email="anuarsh@ailabs.us" }
]
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "transformers>=4.55.0", #tested: 4.55.4, 4.56.1
    "huggingface-hub",
    "requests",
    "mlx>=0.23.0",
    "mlx-lm>=0.22.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[project.urls]
"Homepage" = "https://github.com/Ikaikaalika/strata"
"Bug Tracker" = "https://github.com/Ikaikaalika/strata/issues"

[project.scripts]
miki = "miki.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ollm.kernels" = ["*.metal"]
"miki.optimizer" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
